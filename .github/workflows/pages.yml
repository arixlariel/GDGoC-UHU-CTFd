name: Deploy CTFd Cyber Theme Preview & Sync Live CTFd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jinja2
        run: pip install --quiet jinja2 markupsafe

      - name: Build static preview from real CTFd templates
        env:
          PAGES_BASE_PATH: "/GDGoC-UHU-CTFd"
        run: python3 .github/scripts/build_pages.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-live-ctfd:
    name: Sync Cyber theme to live CTFd
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update CTFd theme_header via Admin REST API
        env:
          CTFD_URL: ${{ secrets.CTFD_URL }}
          CTFD_API_TOKEN: ${{ secrets.CTFD_API_TOKEN }}
          PAGES_BASE_URL: "https://arixlariel.github.io/GDGoC-UHU-CTFd"
          ASSET_VERSION: ${{ github.sha }}
        run: python3 .github/scripts/sync_ctfd_theme.py
