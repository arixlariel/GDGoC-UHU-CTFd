{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="theme-card cyber-error-box">
      <div class="cyber-error-code">502</div>
      <h2 class="h4 fw-bold theme-text-primary mt-3">{% trans %}Bad Gateway{% endtrans %}</h2>
      <p class="theme-text-secondary mt-2 mb-4">El servicio temporalmente no responde. Reintenta en unos segundos.</p>
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary px-4">
        Reintentar
      </a>
    </div>
  </div>
{% endblock %}
