{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="theme-card tilt-card cyber-error-box" data-tilt-max="1.5">
      <div class="tilt-glare" aria-hidden="true"></div>
      <div class="cyber-error-code">404</div>
      <h2 class="h4 fw-bold theme-text-primary mt-3">{% trans %}File not found{% endtrans %}</h2>
      <p class="theme-text-secondary mt-2 mb-4">La ruta solicitada no existe en este nodo de Cyber Trainer.</p>
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary px-4">
        Volver al inicio
      </a>
    </div>
  </div>
{% endblock %}
