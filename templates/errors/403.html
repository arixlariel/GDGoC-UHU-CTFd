{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="theme-card cyber-error-box">
      <div class="cyber-card-accent-bar"></div>
      <div class="theme-badge-pill mb-3"><span>ACCESS::DENIED</span></div>
      <div class="cyber-error-code">403</div>
      <h2 class="h4 fw-bold theme-text-primary mt-3">{% trans %}Forbidden{% endtrans %}</h2>
      <p class="theme-text-secondary mt-2 mb-4">{{ error }}</p>
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary px-4">
        Volver al inicio
      </a>
    </div>
  </div>
{% endblock %}
