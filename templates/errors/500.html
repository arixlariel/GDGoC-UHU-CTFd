{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="theme-card cyber-error-box">
      <div class="cyber-error-code">500</div>
      <h2 class="h4 fw-bold theme-text-primary mt-3">{% trans %}Internal Server Error{% endtrans %}</h2>
      <p class="theme-text-secondary mt-2 mb-4">Ha ocurrido un error interno en el servidor. Inténtalo de nuevo en unos instantes.</p>
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary px-4">
        Volver al inicio
      </a>
    </div>
  </div>
{% endblock %}
