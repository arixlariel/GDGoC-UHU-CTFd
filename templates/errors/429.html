{% extends "base.html" %}

{% block content %}
  <div class="container">
    <div class="theme-card cyber-error-box">
      <div class="cyber-card-accent-bar"></div>
      <div class="theme-badge-pill mb-3"><span>FIREWALL::RATE_LIMIT</span></div>
      <div class="cyber-error-code">429</div>
      <h2 class="h4 fw-bold theme-text-primary mt-3">{% trans %}Too many requests{% endtrans %}</h2>
      <p class="theme-text-secondary mt-2 mb-4">{% trans %}Please slow down!{% endtrans %}</p>
      <a href="{{ url_for('challenges.listing') }}" class="btn btn-primary px-4">
        Volver a Retos
      </a>
    </div>
  </div>
{% endblock %}
